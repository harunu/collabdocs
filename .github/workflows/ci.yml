name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

jobs:
  # ── 1. Build ────────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build backend
        working-directory: backend
        run: npm install && npm run build

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # Point at localhost for the CI E2E run
          VITE_API_URL: http://localhost:3001
          VITE_WS_URL: ws://localhost:3001/ws
        run: npm install && npm run build

  # ── 2. E2E Tests ────────────────────────────────────────────────────────────
  # Runs inside Docker Compose (same as local) so backend:3001 / frontend:5173
  # hostnames resolve correctly inside the Playwright container.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      # Write .env from secrets so docker-compose backend/frontend pick them up
      - name: Create .env
        run: |
          cat > .env <<'ENVEOF'
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_JWT_SECRET=${{ secrets.SUPABASE_JWT_SECRET }}
          VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL=http://backend:3001
          VITE_WS_URL=ws://backend:3001/ws
          E2E_TEST_EMAIL=${{ secrets.E2E_TEST_EMAIL }}
          E2E_TEST_PASSWORD=${{ secrets.E2E_TEST_PASSWORD }}
          E2E_TEST_EMAIL_2=${{ secrets.E2E_TEST_EMAIL_2 }}
          E2E_TEST_PASSWORD_2=${{ secrets.E2E_TEST_PASSWORD_2 }}
          ENVEOF

      # Build images and run Playwright — exits with Playwright's exit code.
      # The playwright container already handles wait-on for backend + frontend.
      # Volume mounts write test results directly to ./e2e/report/ on the runner.
      - name: Run E2E via Docker Compose
        run: docker compose --profile test up --build --exit-code-from playwright playwright

      - name: Stop all services
        if: always()
        run: docker compose --profile test down --volumes

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: e2e/report/
          retention-days: 7

  # ── 3. Deploy frontend to Vercel (main branch only) ─────────────────────────
  deploy-frontend:
    name: Deploy Frontend to Vercel
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build project
        run: npx vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  # ── 4. Deploy backend to Railway (main branch only) ──────────────────────────
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    needs: [build, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Railway
        run: npx @railway/cli@latest up --service collabdocs --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
